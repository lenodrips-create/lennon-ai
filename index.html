<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kepler AI</title>
<meta name="description" content="Kepler AI is a simple, friendly AI you can chat with.">
<link rel="preload" href="fonts/Fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Ubuntu-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>document.documentElement.classList.add('anim')</script>
<style>
@font-face{font-family:"Fredoka";src:url("fonts/Fredoka.woff2") format("woff2");font-weight:300 700;font-stretch:75% 125%;font-display:block}
@font-face{font-family:"Ubuntu";src:url("fonts/Ubuntu-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Ubuntu";src:url("fonts/Ubuntu-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Serif";src:url("fonts/IBMPlexSerif-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Serif";src:url("fonts/IBMPlexSerif-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}
img,svg{display:block}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}

:root{
  /* Layout: full-screen video, headline + white composer centered; chat stacks just above the composer. */
  --font-text:Ubuntu,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:Fredoka,var(--font-text);
  --font-reply:"IBM Plex Serif",Georgia,"Times New Roman",serif;

  --card:#ffffff;
  --line:#e5e7eb;
  --ink:#1f2937;
  --ink-soft:#374151;
  --muted:#9ca3af;
  --idle:#e5e7eb;
  --accent:#E88654;
  --hover:#f3f4f6;
  --on-ink:#ffffff;

  --w:767px;
  --e-primary:cubic-bezier(.16,1,.3,1);
  --e-soft:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
:root[data-box="dark"]{
  --card:#1c1c1f;--line:#2e2e33;--ink:#f3f4f6;--ink-soft:#d1d5db;--muted:#8b8d93;--idle:#3a3a40;
  --hover:#2a2a2f;--on-ink:#111114;
}

html,body{height:100%}
body{
  background:#0a0d12;color:#fff;overflow:hidden;
  font-family:var(--font-text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.stage{position:fixed;inset:0;overflow:hidden;background:#0a0d12}
.stage-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.frame{
  position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  padding-block:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
}

/* ── Hero ── */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(24px,5vh,48px)}
.h1{
  font-family:var(--font-display);font-weight:500;text-align:center;text-wrap:balance;
  font-size:clamp(28px,4.2vw,46px);line-height:1.1;
  text-shadow:0 2px 22px rgba(0,0,0,.30);
}

/* ── Conversation ── */
.log{
  display:none;width:min(var(--w),100%);flex:1;min-height:0;overflow-y:auto;
  flex-direction:column;gap:12px;padding:4px 2px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent;
}
.log>:first-child{margin-top:auto}
.chatting .h1,.chatting .proof{display:none}
.chatting .log{display:flex}
.chatting .hero{justify-content:flex-end;gap:16px;padding-top:calc(50vh - 60px)}
.msg{
  max-width:85%;padding:12px 18px;border-radius:22px;white-space:pre-wrap;overflow-wrap:anywhere;
  font-size:16px;line-height:1.55;
}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--on-ink);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.msg.ai{
  align-self:flex-start;background:var(--card);color:var(--ink);border:1px solid var(--line);
  font-family:var(--font-reply);line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.12);
}
.msg.ai::before{
  content:"Kepler AI";display:block;margin-bottom:2px;
  font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--accent);
}
.msg.error{color:#b45309}

/* ── Composer ── */
.card{
  position:relative;flex:none;width:min(var(--w),100%);
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:32px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.16);
  padding:22px 12px 12px 21px;
}
.ph{
  display:block;width:100%;resize:none;outline:none;
  font-size:16px;line-height:1.5;color:var(--ink);
  min-height:24px;max-height:200px;overflow-y:auto;padding-right:10px;
}
.ph::placeholder{color:var(--muted);opacity:1}
.ph:focus-visible{outline:none}

.tools{display:flex;align-items:center;margin-top:26px;gap:4px}
.ibtn{
  height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 8px;border-radius:12px;
  color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .15s ease;
}
.ibtn:hover{background:var(--hover)}
.ibtn svg{flex:none}
.attach{padding:0 6px;margin-left:-6px}
.spacer{flex:1}
.model{font-weight:400;gap:10px;padding:0 10px}
.send{
  width:36px;height:36px;border-radius:50%;margin-left:20px;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--idle);color:#fff;transition:background .18s ease,transform .12s ease;
}
.send.ready{background:var(--ink);color:var(--on-ink)}
.send.ready:hover{filter:brightness(1.15)}
.send:active{transform:scale(.94)}
.send:disabled{cursor:default}
#file{display:none}

/* Popover menus (Tools, model) */
.menu{
  position:absolute;bottom:52px;z-index:5;min-width:240px;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 18px 48px rgba(0,0,0,.18);padding:6px;
  transform:translateY(-8px);
}
.menu-tools{left:44px}
.menu-model{right:56px}
.menu button{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:10px 12px;border-radius:12px;font-size:15px;cursor:pointer;
}
.menu button:hover{background:var(--hover)}
.menu .sub{display:block;font-size:13px;color:#6b7280;margin-top:1px}
.menu .check{margin-left:auto;color:var(--ink)}

/* ── User menu (top-left) ── */
.ud{position:fixed;z-index:30;top:max(18px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));font-size:14px;color:#18181b}
.ud iconify-icon{display:inline-flex;flex:none}
.ud-trigger{display:block;border-radius:50%;cursor:pointer}
.ud-avatar{
  width:40px;height:40px;border-radius:50%;border:1px solid #fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:#f4f4f5;color:#18181b;font-weight:500;font-size:15px;letter-spacing:.01em;
  box-shadow:0 2px 10px rgba(0,0,0,.18);user-select:none;
}
.ud-content{
  position:absolute;top:calc(100% + 4px);left:0;width:310px;max-width:calc(100vw - 36px);
  max-height:calc(100dvh - 90px);overflow-y:auto;scrollbar-width:none;
  border-radius:16px;background:#f9fafb;border:1px solid #e4e4e7;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  transform-origin:top left;
}
.ud-content::-webkit-scrollbar{display:none}
.ud-content.in{animation:ud-in .15s ease-out}
.ud-content.out{animation:ud-out .12s ease-in forwards}
@keyframes ud-in{from{opacity:0;transform:scale(.95) translateY(-8px)}}
@keyframes ud-out{to{opacity:0;transform:scale(.95)}}
.ud-card{background:#fff;border-radius:16px;padding:4px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1)}
.ud-foot{margin-top:4px;padding:4px;border-radius:16px}
.ud-head{display:flex;align-items:center;padding:8px}
.ud-who{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.ud-who h3{font-weight:600;font-size:14px;color:#111827;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ud-who p{font-size:12px;color:#71717a}
.ud-badge{
  display:inline-flex;align-items:center;border-radius:2px;border:.5px solid;padding:2px 8px;
  font-size:11px;font-weight:600;text-transform:capitalize;flex:none;
}
.ud-badge[data-s="online"]{color:#16a34a;background:#dcfce7;border-color:#86efac}
.ud-badge[data-s="focus"]{color:#d97706;background:#fef3c7;border-color:#fcd34d}
.ud-badge[data-s="offline"]{color:#4b5563;background:#f3f4f6;border-color:#d1d5db}
.ud-item{
  position:relative;width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:8px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px;color:#18181b;outline:none;
  transition:background-color .15s ease;
}
.ud-item:hover,.ud-item:focus-visible,.ud-item[aria-expanded="true"]{background:#f4f4f5}
.ud-item .l{display:flex;align-items:center;gap:6px;font-weight:500;min-width:0}
.ud-item .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ud-item .ic{color:#6b7280;font-size:20px}
.ud-item .ri{color:#6b7280;font-size:16px}
.ud-item .hint{font-size:12px;color:#71717a;font-weight:500}
.ud-item.muted .l{color:#6b7280}
.ud-item.danger .ic{color:#dc2626}
.ud-sep{height:1px;background:#f4f4f5;margin:4px -4px}
.ud-sub{
  position:fixed;z-index:31;min-width:200px;max-width:260px;max-height:320px;overflow-y:auto;
  background:#fff;border:1px solid #e4e4e7;border-radius:6px;padding:4px;
  box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  animation:ud-sub-in .15s ease-out;
}
@keyframes ud-sub-in{from{opacity:0;transform:scale(.95) translateX(-8px)}}
.ud-radio{
  position:relative;width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 32px;
  border-radius:4px;font-size:14px;cursor:pointer;text-align:left;outline:none;color:#18181b;
}
.ud-radio:hover,.ud-radio:focus-visible{background:#f4f4f5}
.ud-radio .ic{color:#6b7280;font-size:20px}
.ud-radio .dot{position:absolute;left:12px;width:8px;height:8px;border-radius:50%;background:currentColor;opacity:0}
.ud-radio[aria-checked="true"] .dot{opacity:1}
.ud-chat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;padding-left:8px}
.ud-empty{padding:8px;font-size:13px;color:#71717a}
.ud-edit{display:flex;gap:6px;padding:4px 8px 8px}
.ud-edit input{
  flex:1;min-width:0;height:34px;padding:0 10px;border-radius:8px;border:1px solid #e4e4e7;background:#fff;
  font-size:14px;color:#18181b;outline:none;
}
.ud-edit input:focus{border-color:#a1a1aa}
.ud-edit button{height:34px;padding:0 12px;border-radius:8px;background:#18181b;color:#fff;font-weight:500;cursor:pointer}

/* ── Login screen ── */
body.booting .frame,body.booting .ud,body.signed-out .frame,body.signed-out .ud{visibility:hidden}
.auth{
  position:fixed;inset:0;z-index:50;background:#ffffff;color:#09090b;overflow-y:auto;
  font-family:"Geist",var(--font-text);display:flex;
  padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right));
}
.auth-col{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;min-height:100%}
.auth-inner{width:100%;max-width:448px;display:flex;flex-direction:column;gap:24px}
.auth-title{font-size:36px;font-weight:600;line-height:1.25}
.auth-title span{font-weight:300;letter-spacing:-.05em;color:#09090b}
@media (min-width:768px){.auth-title{font-size:48px}}
.auth-desc{color:#71717a;font-size:16px;line-height:1.5}
.auth-form{display:flex;flex-direction:column;gap:20px}
.auth-label{display:block;font-size:14px;font-weight:500;color:#71717a;line-height:1.43}
.glass{
  border-radius:16px;border:1px solid #e4e4e7;background:rgba(9,9,11,.05);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background-color .15s,border-color .15s;
}
.glass:focus-within{border-color:rgba(167,139,250,.7);background:rgba(139,92,246,.1)}
.glass input{width:100%;background:transparent;font-size:14px;padding:16px;border-radius:16px;outline:none;color:#09090b}
.glass input::placeholder{color:#71717a}
.pw{position:relative}
.pw input{padding-right:48px}
.eye{position:absolute;top:0;bottom:0;right:12px;display:flex;align-items:center;color:#71717a;cursor:pointer;transition:color .15s}
.eye:hover{color:#09090b}
.auth-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;gap:12px}
.keep{display:flex;align-items:center;gap:12px;cursor:pointer;color:rgba(9,9,11,.9)}
.custom-checkbox{
  appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:0;cursor:pointer;
  border:2px solid #e4e4e7;border-radius:6px;background:transparent;position:relative;transition:all .2s;
}
.custom-checkbox:checked{background:#8b5cf6;border-color:#8b5cf6}
.custom-checkbox:checked::after{
  content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.vlink{color:#a78bfa;transition:color .15s}
.vlink:hover{text-decoration:underline}
.auth-submit{
  width:100%;border-radius:16px;background:#18181b;padding:16px 0;font-weight:500;color:#fafafa;cursor:pointer;
  transition:background-color .15s;font-size:16px;
}
.auth-submit:hover{background:rgba(24,24,27,.9)}
.auth-submit:disabled{opacity:.6;cursor:default}
.auth-msg{font-size:14px;line-height:1.45;color:#dc2626;margin-top:-6px}
.auth-msg[data-kind="info"]{color:#15803d}
.auth-or{position:relative;display:flex;align-items:center;justify-content:center}
.auth-or .rule{width:100%;border-top:1px solid #e4e4e7}
.auth-or .or{position:absolute;padding:0 16px;font-size:14px;color:#71717a;background:#fff}
.auth-oauth{
  width:100%;display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;color:#09090b;
  border:1px solid #e4e4e7;border-radius:16px;padding:16px 0;cursor:pointer;transition:background-color .15s;
}
.auth-oauth:hover{background:#f4f4f5}
.auth-foot{text-align:center;font-size:14px;color:#71717a}
.auth :focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
.glass input:focus-visible{outline:none}

/* Entrance: fade + slide + un-blur, staggered (matches the component's animate-element) */
@keyframes fadeSlideIn{to{opacity:1;filter:blur(0);transform:translateY(0)}}
.auth.played .ae{opacity:0;filter:blur(1px);transform:translateY(10px);animation:fadeSlideIn .6s ease-out forwards}
.auth.played .d1{animation-delay:.1s}.auth.played .d2{animation-delay:.2s}.auth.played .d3{animation-delay:.3s}
.auth.played .d4{animation-delay:.4s}.auth.played .d5{animation-delay:.5s}.auth.played .d6{animation-delay:.6s}
.auth.played .d7{animation-delay:.7s}.auth.played .d8{animation-delay:.8s}.auth.played .d9{animation-delay:.9s}
@media (prefers-reduced-motion:reduce){.auth.played .ae{opacity:1;filter:none;transform:none;animation:none}}

/* ── Footer ── */
.proof{flex:none;display:flex;justify-content:center;padding-top:16px}
.by{font-family:var(--font-display);font-size:14px;color:rgba(255,255,255,.95);text-shadow:0 1px 12px rgba(0,0,0,.35)}

/* ── Phones ── */
@media (max-width:520px){
  .card{border-radius:26px;padding:18px 10px 10px 16px}
  .tools{margin-top:18px}
  .ibtn{font-size:15px}
  .model{padding:0 6px;gap:6px}
  .model .label{max-width:30vw;overflow:hidden;text-overflow:ellipsis}
  .send{margin-left:8px}
  .msg{font-size:15px}
  .menu{left:8px;right:8px;min-width:0}
}

/* ── Entrance ── */
@keyframes e-focus{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{filter:blur(0)}}
@keyframes e-panel{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes e-up{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:no-preference){
  .anim .h1{animation:e-focus 1s var(--e-primary) .2s both}
  .anim .card{animation:e-panel .9s var(--e-primary) .45s both}
  .anim .ud{animation:e-panel .9s var(--e-primary) .45s both}
  .anim .by{animation:e-up .55s var(--e-soft) .9s both}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body class="booting">
<div class="stage">
  <video class="stage-video" autoplay muted loop playsinline preload="auto" src="mountains.mp4"></video>

  <div class="frame" id="frame">
    <main class="hero">
      <h1 class="h1">Ask anything. Kepler will answer.</h1>
      <div class="log" id="log" aria-live="polite"></div>

      <form class="card" id="form">
        <textarea class="ph" id="box" rows="1" aria-label="Message Kepler AI" placeholder="Ask me anything..."></textarea>

        <div class="tools">
          <label class="ibtn attach" for="file" aria-label="Attach a text file" title="Attach a text file">
            <svg width="21" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 6.5v9a4.5 4.5 0 0 1-9 0V5.8a3 3 0 0 1 6 0v9.4a1.5 1.5 0 0 1-3 0V7"/></svg>
          </label>
          <input type="file" id="file" accept=".txt,.md,.csv,.json,.html,.css,.js,.py,text/*">

          <button type="button" class="ibtn" id="toolsBtn" aria-haspopup="menu" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
            <span>Tools</span>
          </button>

          <span class="spacer"></span>

          <button type="button" class="ibtn model" id="modelBtn" aria-haspopup="menu" aria-expanded="false">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="#E88654" aria-hidden="true"><path d="M12 2c.6 4.6 2.9 7.4 8 8.2v1.6c-5.1.8-7.4 3.6-8 8.2h-1.6c-.6-4.6-2.9-7.4-8-8.2v-1.6c5.1-.8 7.4-3.6 8-8.2H12Z" transform="translate(.8 1)"/></svg>
            <span class="label">Kepler-1</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>

          <button type="submit" class="send" id="send" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
          </button>
        </div>

        <div class="menu menu-tools" id="toolsMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-prompt="Explain this to me simply: ">Explain a topic</button>
          <button type="button" role="menuitem" data-prompt="Write a short story about ">Write a story</button>
          <button type="button" role="menuitem" data-prompt="Help me plan my day. Here is what I need to do: ">Plan my day</button>
          <button type="button" role="menuitem" data-action="new">Start a new chat</button>
        </div>

        <div class="menu menu-model" id="modelMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-close>
            <span><span>Kepler-1</span><span class="sub">Fast, friendly answers</span></span>

<script>
  setTimeout(() => document.documentElement.classList.remove('anim'), 2000);

  // ── Supabase (publishable key is meant to be public; Row Level Security keeps each user's data private) ──
  const SUPABASE_URL = 'https://zxvbimdxcrslvdpqqalf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_KGnwpyai1gG2rHBj6XSnmA_VlK-Yc8a';
  const API_URL = SUPABASE_URL + '/functions/v1/lennon-chat';
  const SITE_URL = location.origin + location.pathname;
  const MAX_MESSAGES = 30;

  // "Keep me signed in": remembered sessions live in localStorage, others only until the tab closes.
  const REMEMBER = 'kepler-remember';
  const safe = (fn, fb) => { try { return fn(); } catch { return fb; } };
  const remember = () => safe(() => localStorage.getItem(REMEMBER) !== '0', true);
  const authStorage = {
    getItem: k => safe(() => sessionStorage.getItem(k) ?? localStorage.getItem(k), null),
    setItem: (k, v) => safe(() => {
      if (remember()) { localStorage.setItem(k, v); sessionStorage.removeItem(k); }
      else { sessionStorage.setItem(k, v); localStorage.removeItem(k); }
    }),
    removeItem: k => safe(() => { localStorage.removeItem(k); sessionStorage.removeItem(k); }),
  };
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  const $ = id => document.getElementById(id);
  const frame = $('frame'), log = $('log'), box = $('box'), sendBtn = $('send');

  let user = null;
  let profile = { name: '', status: 'online', theme: 'light' };
  let chats = [];
  let current = null;
  let busy = false;

  // ── Login screen ──
  const auth = $('auth'), authForm = $('authForm'), authMsg = $('authMsg');
  let mode = 'signin';
  const MODES = {
    signin:  { title: 'Welcome', desc: 'Access your account and continue your journey with us', btn: 'Sign In', pass: true, extras: true, foot: ['New to our platform?', 'Create Account', 'signup'] },
    signup:  { title: 'Create account', desc: 'Sign up to save your chats and settings across devices', btn: 'Create Account', pass: true, extras: false, foot: ['Already have an account?', 'Sign In', 'signin'] },
    reset:   { title: 'Reset password', desc: "Enter your email and we'll send you a link to set a new password", btn: 'Send reset link', pass: false, extras: false, foot: ['Remembered it?', 'Sign In', 'signin'] },
    newpass: { title: 'New password', desc: 'Choose a new password for your account', btn: 'Update password', pass: true, email: false, extras: false, foot: null },
  };
  function setMode(m) {
    mode = m;
    const c = MODES[m];
    $('authTitle').textContent = c.title;
    $('authDesc').textContent = c.desc;
    $('authSubmit').textContent = c.btn;
    $('fEmail').hidden = c.email === false;
    $('fPass').hidden = !c.pass;
    $('fExtras').hidden = !c.extras;
    $('authOr').hidden = $('authGithub').hidden = m === 'newpass';
    $('authPass').autocomplete = m === 'signin' ? 'current-password' : 'new-password';
    $('authFoot').hidden = !c.foot;
    if (c.foot) { $('authFootText').textContent = c.foot[0] + ' '; $('authFootLink').textContent = c.foot[1]; $('authFootLink').dataset.to = c.foot[2]; }
    say('');
  }
  function say(text, kind = 'error') { authMsg.textContent = text; authMsg.dataset.kind = kind; authMsg.hidden = !text; }
  function showAuth(m = 'signin') {
    setMode(m);
    document.body.classList.remove('booting');
    document.body.classList.add('signed-out');
    auth.hidden = false;
    auth.classList.remove('played'); void auth.offsetWidth; auth.classList.add('played');
  }
  function hideAuth() {
    auth.hidden = true;
    document.body.classList.remove('booting', 'signed-out');
  }

  $('authEye').onclick = () => {
    const p = $('authPass'), show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('eyeOn').toggleAttribute('hidden', show); $('eyeOff').toggleAttribute('hidden', !show);
    $('authEye').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  };
  $('authReset').onclick = e => { e.preventDefault(); setMode('reset'); };
  $('authFootLink').onclick = e => { e.preventDefault(); setMode(e.currentTarget.dataset.to); };
  $('authGithub').onclick = async () => {
    say('');
    const { error } = await sb.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: SITE_URL } });
    if (error) say(error.message.includes('not enabled') ? 'GitHub sign-in is not turned on yet.' : error.message);
  };

  authForm.addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('authEmail').value.trim(), password = $('authPass').value;
    const btn = $('authSubmit');
    if (mode !== 'newpass' && !email) return say('Enter your email address.');
    if (MODES[mode].pass && password.length < 6) return say('Use a password with at least 6 characters.');
    btn.disabled = true; say('');
    try {
      if (mode === 'signin') {
        safe(() => localStorage.setItem(REMEMBER, $('authRemember').checked ? '1' : '0'));
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) say(error.message === 'Invalid login credentials' ? 'That email and password don\'t match. Try again or reset your password.' : error.message);
      } else if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: SITE_URL } });
        if (error) say(error.message);
        else if (!data.session) { setMode('signin'); say('Check your email for a link to confirm your account, then sign in.', 'info'); }
      } else if (mode === 'reset') {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL });
        if (error) say(error.message);
        else say('If that email has an account, a reset link is on its way.', 'info');
      } else if (mode === 'newpass') {
        const { error } = await sb.auth.updateUser({ password });
        if (error) say(error.message);
        else { hideAuth(); await loadUserData(); }
      }
    } catch {
      say('Could not reach the sign-in service. Check your connection and try again.');
    } finally {
      btn.disabled = false;
    }
  });

  // ── Data (Supabase tables: profiles, chats) ──
  async function loadUserData() {
    const [p, c] = await Promise.all([
      sb.from('profiles').select('name,status,theme').eq('id', user.id).maybeSingle(),
      sb.from('chats').select('id,title,messages,updated_at').order('updated_at', { ascending: false }).limit(100),
    ]);
    profile = p.data || { name: user.user_metadata?.full_name || user.user_metadata?.user_name || '', status: 'online', theme: 'light' };
    if (!p.data) sb.from('profiles').upsert({ id: user.id, ...profile });
    chats = c.data || [];
    current = null;
    paintUser(); render(); sync();
  }
  const saveProfile = () => user && sb.from('profiles').upsert({ id: user.id, ...profile, updated_at: new Date().toISOString() }).then(() => {});
  async function saveChat(chat) {
    const row = { title: chat.title, messages: chat.messages, updated_at: new Date().toISOString() };
    if (chat.id) { await sb.from('chats').update(row).eq('id', chat.id); return; }
    const { data } = await sb.from('chats').insert(row).select('id').single();
    if (data) chat.id = data.id;
  }

  // ── Chat ──
  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function render() {
    log.innerHTML = '';
    const has = current && current.messages.length;
    frame.classList.toggle('chatting', !!has);
    if (has) for (const m of current.messages) add(m.role === 'user' ? 'user' : 'ai', m.content);
  }
  function sync() {
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 200) + 'px';
    sendBtn.classList.toggle('ready', !!box.value.trim() && !busy);
  }
  box.addEventListener('input', sync);

  // Composer menus
  const menus = [[$('toolsBtn'), $('toolsMenu')], [$('modelBtn'), $('modelMenu')]];
  function closeMenus() { for (const [b, m] of menus) { m.hidden = true; b.setAttribute('aria-expanded', 'false'); } }
  for (const [b, m] of menus) {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const open = m.hidden;
      closeMenus(); closeMenu();
      m.hidden = !open;
      b.setAttribute('aria-expanded', String(open));
    });
  }
  document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

  $('toolsMenu').addEventListener('click', e => {
    const item = e.target.closest('button');
    if (!item) return;
    closeMenus();
    if (item.dataset.action === 'new') { if (busy) return; current = null; render(); }
    else box.value = item.dataset.prompt;
    sync(); box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  });
  $('modelMenu').addEventListener('click', () => closeMenus());

  $('file').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (f.size > 12000) { frame.classList.add('chatting'); add('ai error', 'That file is too big. Attach a text file under 12 KB.'); return; }
    const text = await f.text();
    box.value = (box.value ? box.value + '\n\n' : '') + `Here is ${f.name}:\n${text}`;
    sync(); box.focus();
  };

  async function send() {
    const text = box.value.trim();
    if (!text || busy || !user) return;
    if (text.length > 4000) { frame.classList.add('chatting'); add('ai error', 'That message is too long. Keep it under 4,000 characters.'); return; }
    busy = true; sendBtn.disabled = true;
    box.value = ''; sync();
    if (!current) {
      current = { id: null, title: text.slice(0, 40), messages: [] };
      chats.unshift(current);
      log.innerHTML = '';
    }
    current.messages.push({ role: 'user', content: text });
    frame.classList.add('chatting');
    add('user', text);
    const out = add('ai', '...');
    const chat = current;
    try {
      const { data: s } = await sb.auth.getSession();
      if (!s.session) { out.classList.add('error'); out.textContent = 'You were signed out. Sign in again to keep chatting.'; return; }
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.session.access_token },
        body: JSON.stringify({ messages: chat.messages.slice(-MAX_MESSAGES) }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { out.classList.add('error'); out.textContent = data.error || 'Something went wrong. Try again.'; return; }
      out.textContent = data.reply;
      chat.messages.push({ role: 'assistant', content: data.reply });
    } catch {
      out.classList.add('error');
      out.textContent = 'Could not reach Kepler AI. Check your connection and try again.';
    } finally {
      saveChat(chat).catch(() => {});
      busy = false; sendBtn.disabled = false; sync();
      log.scrollTop = log.scrollHeight;
      box.focus();
    }
  }
  $('form').addEventListener('submit', e => { e.preventDefault(); send(); });
  box.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  // ── User menu (top-left) ──
  const udBtn = $('udBtn'), udMenu = $('udMenu');
  let sub = null, clearArmed = false;

  function paintUser() {
    const email = user?.email || '';
    const name = (profile.name || '').trim() || email.split('@')[0] || 'You';
    $('udName').textContent = name;
    $('udHandle').textContent = email || 'Signed in';
    const initials = name.split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'Y';
    document.querySelectorAll('[data-initials]').forEach(el => el.textContent = initials);
    const st = profile.status || 'online';
    $('udBadge').dataset.s = st; $('udBadge').textContent = st;
    const dark = profile.theme === 'dark';
    if (dark) document.documentElement.dataset.box = 'dark'; else delete document.documentElement.dataset.box;
    $('udTheme').textContent = dark ? 'Dark' : 'Light';
  }
  function closeSub() {
    if (sub) { sub.remove(); sub = null; }
    udMenu.querySelectorAll('[data-sub]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }
  function openMenu() {
    closeMenus();
    udMenu.hidden = false;
    udMenu.classList.remove('out'); udMenu.classList.add('in');
    udBtn.setAttribute('aria-expanded', 'true');
    clearArmed = false; resetClear();
  }
  function closeMenu() {
    if (udMenu.hidden) return;
    closeSub();
    $('udEdit').hidden = true;
    udBtn.setAttribute('aria-expanded', 'false');
    udMenu.classList.remove('in'); udMenu.classList.add('out');
    setTimeout(() => { if (udMenu.classList.contains('out')) { udMenu.hidden = true; udMenu.classList.remove('out'); } }, 120);
  }
  udBtn.addEventListener('click', e => { e.stopPropagation(); udMenu.hidden ? openMenu() : closeMenu(); });
  document.addEventListener('click', e => { if (!e.target.closest('.ud') && !e.target.closest('.ud-sub')) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

  function radio(label, icon, checked, onPick) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ud-radio'; b.setAttribute('role', 'menuitemradio');
    b.setAttribute('aria-checked', String(checked));
    b.innerHTML = '<span class="dot"></span>' + (icon ? `<iconify-icon class="ic" icon="${icon}"></iconify-icon>` : '');
    const t = document.createElement('span'); t.textContent = label; b.appendChild(t);
    b.onclick = e => { e.stopPropagation(); onPick(); };
    return b;
  }
  function openSub(trigger) {
    const kind = trigger.dataset.sub;
    const wasOpen = trigger.getAttribute('aria-expanded') === 'true';
    closeSub();
    if (wasOpen) return;
    sub = document.createElement('div');
    sub.className = 'ud-sub'; sub.setAttribute('role', 'menu');
    if (kind === 'status') {
      const cur = profile.status || 'online';
      [['online', 'solar:check-circle-line-duotone', 'Online'],
       ['focus', 'solar:emoji-funny-circle-line-duotone', 'Focus'],
       ['offline', 'solar:moon-sleep-line-duotone', 'Appear Offline']].forEach(([v, ic, label]) =>
        sub.appendChild(radio(label, ic, cur === v, () => { profile.status = v; saveProfile(); paintUser(); closeSub(); })));
    } else if (!chats.length) {
      const p = document.createElement('p'); p.className = 'ud-empty'; p.textContent = 'No chats yet. Send a message to start one.';
      sub.appendChild(p);
    } else {
      for (const c of chats) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'ud-radio'; b.style.paddingLeft = '8px';
        const t = document.createElement('span'); t.className = 'ud-chat'; t.style.paddingLeft = '0';
        t.textContent = (c === current ? '• ' : '') + (c.title || 'New chat');
        b.appendChild(t);
        b.onclick = e => { e.stopPropagation(); if (busy) return; current = c; render(); closeMenu(); };
        sub.appendChild(b);
      }
    }
    document.body.appendChild(sub);
    trigger.setAttribute('aria-expanded', 'true');
    const r = trigger.getBoundingClientRect(), w = sub.offsetWidth, h = sub.offsetHeight;
    let left = r.right + 6, top = r.top - 4;
    if (left + w > innerWidth - 8) { left = Math.max(8, r.left + 12); top = r.bottom + 4; }
    top = Math.min(top, innerHeight - h - 8);
    sub.style.left = left + 'px'; sub.style.top = Math.max(8, top) + 'px';
  }
  function resetClear() { $('udClear').querySelector('.l span').textContent = 'Clear all chats'; }

  udMenu.addEventListener('click', async e => {
    const t = e.target.closest('[data-sub],[data-act]');
    if (!t) return;
    e.stopPropagation();
    if (t.dataset.sub) { openSub(t); return; }
    closeSub();
    const act = t.dataset.act;
    if (act === 'profile') {
      const f = $('udEdit'); f.hidden = !f.hidden;
      if (!f.hidden) { $('udNameInput').value = profile.name || ''; $('udNameInput').focus(); }
    } else if (act === 'appearance') {
      profile.theme = profile.theme === 'dark' ? 'light' : 'dark'; saveProfile(); paintUser();
    } else if (act === 'new') {
      if (busy) return; current = null; render(); closeMenu(); box.focus();
    } else if (act === 'about' || act === 'help') {
      if (busy) return;
      current = null; render(); frame.classList.add('chatting');
      add('ai', act === 'about'
        ? "I'm Kepler AI, a friendly assistant. Ask me questions, get help with writing or homework, or just chat. Your chats are saved to your account."
        : "Type a message in the box and press Enter to send it. Use Tools for quick starters, the paperclip to add a text file, and Chat history in this menu to go back to an old chat.");
      closeMenu();
    } else if (act === 'clear') {
      if (!clearArmed) { clearArmed = true; t.querySelector('.l span').textContent = 'Click again to clear'; return; }
      await sb.from('chats').delete().eq('user_id', user.id);
      chats = []; current = null; render(); clearArmed = false; resetClear(); closeMenu();
    } else if (act === 'logout') {
      closeMenu();
      await sb.auth.signOut();
    }
  });
  $('udEdit').addEventListener('submit', e => {
    e.preventDefault();
    profile.name = $('udNameInput').value.trim().slice(0, 40); saveProfile(); paintUser();
    $('udEdit').hidden = true;
  });

  // ── Session ──
  let lastUserId = null;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') { user = session?.user || null; showAuth('newpass'); return; }
    if (mode === 'newpass' && !auth.hidden && session) return;
    user = session?.user || null;
    if (!user) {
      lastUserId = null; chats = []; current = null; render();
      showAuth('signin');
      return;
    }
    hideAuth();
    if (user.id !== lastUserId) {
      lastUserId = user.id;
      setTimeout(() => loadUserData().catch(() => {}), 0);
    }
  });
</script>
