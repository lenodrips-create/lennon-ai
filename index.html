<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kepler AI</title>
<meta name="description" content="Kepler AI is a simple, friendly AI you can chat with.">
<link rel="preload" href="fonts/Fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Ubuntu-Regular.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add('anim')</script>
<style>
@font-face{font-family:"Fredoka";src:url("fonts/Fredoka.woff2") format("woff2");font-weight:300 700;font-stretch:75% 125%;font-display:block}
@font-face{font-family:"Ubuntu";src:url("fonts/Ubuntu-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Ubuntu";src:url("fonts/Ubuntu-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Serif";src:url("fonts/IBMPlexSerif-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Serif";src:url("fonts/IBMPlexSerif-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}
img,svg{display:block}

:root{
  /* Layout: full-screen video, headline + white composer centered; chat stacks just above the composer. */
  --font-text:Ubuntu,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:Fredoka,var(--font-text);
  --font-reply:"IBM Plex Serif",Georgia,"Times New Roman",serif;

  --card:#ffffff;
  --line:#e5e7eb;
  --ink:#1f2937;
  --ink-soft:#374151;
  --muted:#9ca3af;
  --idle:#e5e7eb;
  --accent:#E88654;

  --w:767px;
  --e-primary:cubic-bezier(.16,1,.3,1);
  --e-soft:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}

html,body{height:100%}
body{
  background:#0a0d12;color:#fff;overflow:hidden;
  font-family:var(--font-text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.stage{position:fixed;inset:0;overflow:hidden;background:#0a0d12}
.stage-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.frame{
  position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  padding-block:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
}

/* ── Hero ── */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(24px,5vh,48px)}
.h1{
  font-family:var(--font-display);font-weight:500;text-align:center;text-wrap:balance;
  font-size:clamp(28px,4.2vw,46px);line-height:1.1;
  text-shadow:0 2px 22px rgba(0,0,0,.30);
}

/* ── Conversation ── */
.log{
  display:none;width:min(var(--w),100%);flex:1;min-height:0;overflow-y:auto;
  flex-direction:column;gap:12px;padding:4px 2px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent;
}
.log>:first-child{margin-top:auto}
.chatting .h1,.chatting .proof{display:none}
.chatting .log{display:flex}
.chatting .hero{justify-content:flex-end;gap:16px;padding-top:calc(50vh - 60px)}
.msg{
  max-width:85%;padding:12px 18px;border-radius:22px;white-space:pre-wrap;overflow-wrap:anywhere;
  font-size:16px;line-height:1.55;
}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.msg.ai{
  align-self:flex-start;background:var(--card);color:var(--ink);border:1px solid var(--line);
  font-family:var(--font-reply);line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.12);
}
.msg.ai::before{
  content:"Kepler AI";display:block;margin-bottom:2px;
  font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--accent);
}
.msg.error{color:#b45309}

/* ── Composer ── */
.card{
  position:relative;flex:none;width:min(var(--w),100%);
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:32px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.16);
  padding:22px 12px 12px 21px;
}
.ph{
  display:block;width:100%;resize:none;outline:none;
  font-size:16px;line-height:1.5;color:var(--ink);
  min-height:24px;max-height:200px;overflow-y:auto;padding-right:10px;
}
.ph::placeholder{color:var(--muted);opacity:1}
.ph:focus-visible{outline:none}

.tools{display:flex;align-items:center;margin-top:26px;gap:4px}
.ibtn{
  height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 8px;border-radius:12px;
  color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .15s ease;
}
.ibtn:hover{background:#f3f4f6}
.ibtn svg{flex:none}
.attach{padding:0 6px;margin-left:-6px}
.spacer{flex:1}
.model{font-weight:400;gap:10px;padding:0 10px}
.send{
  width:36px;height:36px;border-radius:50%;margin-left:20px;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--idle);color:#fff;transition:background .18s ease,transform .12s ease;
}
.send.ready{background:var(--ink)}
.send.ready:hover{background:#000}
.send:active{transform:scale(.94)}
.send:disabled{cursor:default}
#file{display:none}

/* Popover menus (Tools, model) */
.menu{
  position:absolute;bottom:52px;z-index:5;min-width:240px;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 18px 48px rgba(0,0,0,.18);padding:6px;
  transform:translateY(-8px);
}
.menu-tools{left:44px}
.menu-model{right:56px}
.menu button{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:10px 12px;border-radius:12px;font-size:15px;cursor:pointer;
}
.menu button:hover{background:#f3f4f6}
.menu .sub{display:block;font-size:13px;color:#6b7280;margin-top:1px}
.menu .check{margin-left:auto;color:var(--ink)}

/* ── Footer ── */
.proof{flex:none;display:flex;justify-content:center;padding-top:16px}
.by{font-family:var(--font-display);font-size:14px;color:rgba(255,255,255,.95);text-shadow:0 1px 12px rgba(0,0,0,.35)}

/* ── Phones ── */
@media (max-width:520px){
  .card{border-radius:26px;padding:18px 10px 10px 16px}
  .tools{margin-top:18px}
  .ibtn{font-size:15px}
  .model{padding:0 6px;gap:6px}
  .model .label{max-width:30vw;overflow:hidden;text-overflow:ellipsis}
  .send{margin-left:8px}
  .msg{font-size:15px}
  .menu{left:8px;right:8px;min-width:0}
}

/* ── Entrance ── */
@keyframes e-focus{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{filter:blur(0)}}
@keyframes e-panel{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes e-up{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:no-preference){
  .anim .h1{animation:e-focus 1s var(--e-primary) .2s both}
  .anim .card{animation:e-panel .9s var(--e-primary) .45s both}
  .anim .by{animation:e-up .55s var(--e-soft) .9s both}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="stage">
  <video class="stage-video" autoplay muted loop playsinline preload="auto" src="mountains.mp4"></video>

  <div class="frame" id="frame">
    <main class="hero">
      <h1 class="h1">Ask anything. Kepler will answer.</h1>
      <div class="log" id="log" aria-live="polite"></div>

      <form class="card" id="form">
        <textarea class="ph" id="box" rows="1" aria-label="Message Kepler AI" placeholder="Ask me anything..."></textarea>

        <div class="tools">
          <label class="ibtn attach" for="file" aria-label="Attach a text file" title="Attach a text file">
            <svg width="21" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 6.5v9a4.5 4.5 0 0 1-9 0V5.8a3 3 0 0 1 6 0v9.4a1.5 1.5 0 0 1-3 0V7"/></svg>
          </label>
          <input type="file" id="file" accept=".txt,.md,.csv,.json,.html,.css,.js,.py,text/*">

          <button type="button" class="ibtn" id="toolsBtn" aria-haspopup="menu" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
            <span>Tools</span>
          </button>

          <span class="spacer"></span>

          <button type="button" class="ibtn model" id="modelBtn" aria-haspopup="menu" aria-expanded="false">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="#E88654" aria-hidden="true"><path d="M12 2c.6 4.6 2.9 7.4 8 8.2v1.6c-5.1.8-7.4 3.6-8 8.2h-1.6c-.6-4.6-2.9-7.4-8-8.2v-1.6c5.1-.8 7.4-3.6 8-8.2H12Z" transform="translate(.8 1)"/></svg>
            <span class="label">Kepler-1</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>

          <button type="submit" class="send" id="send" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
          </button>
        </div>

        <div class="menu menu-tools" id="toolsMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-prompt="Explain this to me simply: ">Explain a topic</button>
          <button type="button" role="menuitem" data-prompt="Write a short story about ">Write a story</button>
          <button type="button" role="menuitem" data-prompt="Help me plan my day. Here is what I need to do: ">Plan my day</button>
          <button type="button" role="menuitem" data-action="new">Start a new chat</button>
        </div>

        <div class="menu menu-model" id="modelMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-close>
            <span><span>Kepler-1</span><span class="sub">Fast, friendly answers</span></span>
            <svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
          </button>
        </div>
      </form>
    </main>

    <footer class="proof">
      <p class="by">Your friendly AI, powered by Groq</p>
    </footer>
  </div>
</div>

<script>
  setTimeout(() => document.documentElement.classList.remove('anim'), 2000);

  // Supabase Edge Function that holds the Groq key. No key lives in this file.
  const API_URL = 'https://zxvbimdxcrslvdpqqalf.supabase.co/functions/v1/lennon-chat';
  const MAX_MESSAGES = 30;
  const STORE = 'kepler-chats';

  const $ = id => document.getElementById(id);
  const frame = $('frame'), log = $('log'), box = $('box'), sendBtn = $('send');

  let chats = [];
  try { chats = JSON.parse(localStorage.getItem(STORE)) || []; } catch {}
  let current = null;
  let busy = false;

  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(chats)); } catch {} };

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function render() {
    log.innerHTML = '';
    const has = current && current.messages.length;
    frame.classList.toggle('chatting', !!has);
    if (has) for (const m of current.messages) add(m.role === 'user' ? 'user' : 'ai', m.content);
  }

  // Grow the box with its text and light up the send button when there's something to send.
  function sync() {
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 200) + 'px';
    sendBtn.classList.toggle('ready', !!box.value.trim() && !busy);
  }
  box.addEventListener('input', sync);

  // Menus
  const menus = [[$('toolsBtn'), $('toolsMenu')], [$('modelBtn'), $('modelMenu')]];
  function closeMenus() { for (const [b, m] of menus) { m.hidden = true; b.setAttribute('aria-expanded', 'false'); } }
  for (const [b, m] of menus) {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const open = m.hidden;
      closeMenus();
      m.hidden = !open;
      b.setAttribute('aria-expanded', String(open));
    });
  }
  document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

  $('toolsMenu').addEventListener('click', e => {
    const item = e.target.closest('button');
    if (!item) return;
    closeMenus();
    if (item.dataset.action === 'new') {
      if (busy) return;
      current = null; render();
    } else {
      box.value = item.dataset.prompt;
    }
    sync();
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  });
  $('modelMenu').addEventListener('click', () => closeMenus());

  $('file').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (f.size > 12000) { frame.classList.add('chatting'); add('ai error', 'That file is too big. Attach a text file under 12 KB.'); return; }
    const text = await f.text();
    box.value = (box.value ? box.value + '\n\n' : '') + `Here is ${f.name}:\n${text}`;
    sync();
    box.focus();
  };

  async function send() {
    const text = box.value.trim();
    if (!text || busy) return;
    if (text.length > 4000) { frame.classList.add('chatting'); add('ai error', 'That message is too long. Keep it under 4,000 characters.'); return; }
    busy = true; sendBtn.disabled = true;
    box.value = ''; sync();
    if (!current) {
      current = { id: Date.now(), title: text.slice(0, 40), messages: [] };
      chats.unshift(current);
      log.innerHTML = '';
    }
    current.messages.push({ role: 'user', content: text });
    save();
    frame.classList.add('chatting');
    add('user', text);
    const out = add('ai', '...');
    const chat = current;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chat.messages.slice(-MAX_MESSAGES) }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { out.classList.add('error'); out.textContent = data.error || 'Something went wrong. Try again.'; return; }
      out.textContent = data.reply;
      chat.messages.push({ role: 'assistant', content: data.reply });
      save();
    } catch {
      out.classList.add('error');
      out.textContent = 'Could not reach Kepler AI. Check your connection and try again.';
    } finally {
      busy = false; sendBtn.disabled = false; sync();
      log.scrollTop = log.scrollHeight;
      box.focus();
    }
  }

  $('form').addEventListener('submit', e => { e.preventDefault(); send(); });
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  render(); sync();
</script>
</body>
</html>
