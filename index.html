<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kepler AI</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="brand/icon-512.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="description" content="Kepler AI is a simple, friendly AI you can chat with.">
<meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<style>
/* Terminal look: two colours only (black and white), monospace, no rounded corners. */
:root{
  --bg:#000;
  --fg:#fff;
  --font:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  --bar:28px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;letter-spacing:inherit}
button{cursor:pointer;text-align:left}
a{color:inherit}
img{display:block}
[hidden]{display:none!important}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:1px dashed var(--fg);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Top and bottom bars: black with white text */
.bar{flex:none;display:flex;align-items:center;gap:1ch;height:var(--bar);padding:0 1ch;background:var(--bg);color:var(--fg);white-space:nowrap;overflow:hidden}
.bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bar b{font-weight:700}
.bar button,.bar a{text-decoration:none;padding:0 .5ch;line-height:var(--bar)}
.bar button:hover,.bar a:hover{background:var(--fg);color:var(--bg)}
.bar :focus-visible{outline:1px dashed var(--fg);outline-offset:-3px}
body:not(.in) .only-in{display:none!important}
.only-narrow{display:none}

.main{flex:1;min-height:0;display:flex}

/* Saved chats */
.side{width:280px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--fg);background:var(--bg)}
body:not(.in) .side{display:none}
.side-h{display:flex;justify-content:space-between;padding:10px 12px 6px;font-weight:700}
.side-find{display:flex;gap:1ch;margin:0 12px 8px;padding:4px 8px;border:1px solid var(--fg)}
.side-find input{flex:1;min-width:0;outline:none;caret-color:var(--fg)}
.side-find input::placeholder{color:var(--fg);opacity:1}
.side-list{list-style:none;flex:1;min-height:0;overflow-y:auto;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--fg) var(--bg)}
.side-list li{display:flex}
.side-list .c{flex:1;min-width:0;display:flex;gap:1ch;padding:2px 6px;white-space:nowrap}
.side-list .c .t{overflow:hidden;text-overflow:ellipsis}
.side-list .c:hover,.side-list li.on .c{background:var(--fg);color:var(--bg)}
.side-list .x{flex:none;padding:2px 6px}
.side-list .x:hover{background:var(--fg);color:var(--bg)}
.side-list .empty{padding:2px 6px}
.side-new{margin:8px 12px 12px;padding:4px 8px;border:1px solid var(--fg);text-align:center}
.side-new:hover{background:var(--fg);color:var(--bg)}

/* The terminal */
.term{flex:1;min-width:0;overflow-y:auto;padding:14px 18px 24px;scrollbar-width:thin;scrollbar-color:var(--fg) var(--bg);overflow-wrap:anywhere}
.ln{white-space:pre-wrap;min-height:1.5em}
.ln.b,.ps{font-weight:700}
.ln.err::before{content:"ERR ";font-weight:700;background:var(--fg);color:var(--bg);padding:0 .5ch;margin-right:1ch}
.ln.ok::before{content:"[ OK ] ";font-weight:700}
.rule{white-space:pre;overflow:hidden}
.banner{font:inherit;font-size:min(15px,3.6vw);line-height:1.2;white-space:pre;margin:4px 0 10px;font-weight:700}
.opt{display:flex;gap:2ch;width:100%;max-width:60ch;padding:0 1ch}
.opt:hover{background:var(--fg);color:var(--bg)}
.opt .k{flex:none;width:14ch;font-weight:700}
.help-row{display:flex;gap:2ch}
.help-row .k{flex:none;width:18ch;font-weight:700}

/* Password screen */
.lock{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--bg);color:var(--fg);display:flex;justify-content:center;
  padding:max(48px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
.lock-in{width:100%;max-width:370px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.slab{font-family:"Rockwell","Roboto Slab","Zilla Slab","Museo Slab",Georgia,"Times New Roman",serif;font-weight:700}
.eye{display:flex;flex-direction:column;align-items:center;line-height:1;padding-bottom:8px;border-bottom:2px solid var(--fg);margin-bottom:28px}
.eye span{display:block}
.eye .r1{font-size:56px;margin-bottom:12px}
.eye .r2{font-size:34px;letter-spacing:.45em;margin-right:-.45em;margin-bottom:12px}
.eye .r3{font-size:22px;letter-spacing:.6em;margin-right:-.6em}
.lock h1{font-size:clamp(28px,7vw,34px);line-height:1.15;margin-bottom:10px}
.lock-sub{margin-bottom:32px}
.lock-card{width:100%;border:1px solid var(--fg);padding:22px 18px 20px;text-align:left}
.lock-card label.t{display:block;font-weight:600;margin-bottom:10px}
.lock-card input{width:100%;height:46px;padding:0 12px;border:1px solid var(--fg);outline:none;font-size:16px;caret-color:var(--fg)}
.lock-card input:focus{box-shadow:0 0 0 1px var(--fg)}
.lock-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}
.lock-row select{appearance:none;-webkit-appearance:none;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--fg);
  height:36px;padding:0 30px 0 12px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.lock-row select option{background:var(--bg);color:var(--fg)}
.lock-go{width:100%;height:50px;background:var(--fg);color:var(--bg);font-weight:600;font-size:17px;text-align:center}
.lock-go:hover{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.lock-go:disabled{cursor:default}
.lock-err{margin-top:10px;font-weight:600}
.lock-err::before{content:"! "}
.lock-note{margin-top:16px;font-size:14px;line-height:1.5}
.lock-legal{margin-top:24px;font-size:13px;display:flex;gap:16px}
.link-btn{text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{background:var(--fg);color:var(--bg);text-decoration:none}

.msg{margin:10px 0}
.msg.user{white-space:pre-wrap}
.msg.ai .who{font-weight:700}
.msg.ai .body{border-left:1px solid var(--fg);padding-left:1.5ch;margin-top:2px}
.msg-text{white-space:pre-wrap}
.msg-text+.msg-text{margin-top:6px}
.tx-mark,.tx-label,.tx-strong{font-weight:700}
.tx-code{background:var(--fg);color:var(--bg);padding:0 .4ch;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tx-link{text-decoration:underline;text-underline-offset:3px}
.code{border:1px solid var(--fg);margin:8px 0}
.code-head{display:flex;justify-content:space-between;background:var(--fg);color:var(--bg);padding:0 1ch}
.code-head button:hover{background:var(--bg);color:var(--fg)}
.code pre{margin:0;padding:8px 1ch;overflow:auto;max-height:440px;font:inherit;font-size:14px;tab-size:2;white-space:pre;scrollbar-width:thin;scrollbar-color:var(--fg) var(--bg)}
.fig{margin:8px 0;max-width:min(420px,100%)}
.fig img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--fg);background:var(--bg);filter:grayscale(1) contrast(1.15)}
.fig figcaption{display:flex;gap:1ch;justify-content:space-between;font-size:13px;margin-top:2px}
.fig figcaption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fig.failed img{display:none}
.acts{display:flex;gap:1ch;margin-top:4px;padding-left:calc(1.5ch + 1px)}
.acts button{padding:0 .5ch}
.acts button:hover,.acts button.on{background:var(--fg);color:var(--bg)}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:var(--fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Command line */
.cmd{display:flex;gap:1ch;align-items:flex-start;margin-top:6px}
.cmd .ps{flex:none;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.cmd textarea,.cmd input{flex:1;min-width:0;display:block;resize:none;outline:none;line-height:1.5;caret-color:var(--fg);caret-shape:block;min-height:1.5em;max-height:40vh;overflow-y:auto}
.cmd :focus-visible{outline:none}
#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}

/* Phones and narrow windows: chats become a slide-out panel */
.scrim{display:none}
@media (max-width:899px){
  body{font-size:14px}
  .only-narrow{display:inline}
  .only-wide{display:none!important}
  .side{position:fixed;z-index:20;left:0;top:calc(var(--bar) + env(safe-area-inset-top));bottom:calc(var(--bar) + env(safe-area-inset-bottom));width:min(300px,86vw);transform:translateX(-102%);visibility:hidden}
  body.side-open .side{transform:none;visibility:visible}
  body.side-open .scrim{display:block;position:fixed;inset:0;z-index:15;background:var(--bg);opacity:.7}
  .term{padding:10px 12px 20px}
  .cmd textarea,.cmd input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="grow"><b>KEPLER//AI</b> <span class="only-wide">— tty1 — <span id="barUser">locked</span></span></span>
    <button type="button" class="only-in only-narrow" id="barChats" aria-expanded="false" aria-controls="side">[chats]</button>
    <button type="button" class="only-in" id="barNew">[new]</button>
    <button type="button" class="only-in" id="barHelp">[help]</button>
    <button type="button" class="only-in" id="barOut">[lock]</button>
  </header>

  <div class="main">
    <aside class="side" id="side" aria-label="Saved chats">
      <div class="side-h"><span>~/chats</span><span id="sideCount"></span></div>
      <label class="side-find"><span aria-hidden="true">grep</span><input id="find" type="search" placeholder="..." aria-label="Search chats" autocomplete="off" spellcheck="false"></label>
      <ul class="side-list" id="list"></ul>
      <button type="button" class="side-new" id="sideNew">[+] new chat</button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="term" id="term">
      <div id="out" role="log" aria-live="polite"></div>
      <form class="cmd" id="form" autocomplete="off" hidden>
        <label class="ps" id="ps1" for="box">&gt;</label>
        <textarea id="box" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </form>
      <input type="file" id="file" accept=".txt,.md,.csv,.json,.html,.css,.js,.py,text/*" tabindex="-1" aria-hidden="true">
    </main>
  </div>

  <footer class="bar">
    <span class="grow" id="status">-- BOOT --</span>
    <a href="privacy.html">privacy</a><a href="terms.html">terms</a><a href="credits.html">credits</a>
    <span id="clock" class="only-wide" aria-hidden="true"></span>
  </footer>
</div>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle" hidden>
  <div class="lock-in">
    <div class="eye slab" aria-hidden="true"><span class="r1">K</span><span class="r2">EP</span><span class="r3">LER</span></div>
    <h1 class="slab" id="lockTitle">Kepler is private</h1>
    <p class="lock-sub">Enter the password to continue.</p>
    <form class="lock-card" id="lockForm" autocomplete="on">
      <input type="text" name="username" autocomplete="username" value="kepler" hidden>
      <label class="t" for="lockPw">Password</label>
      <input id="lockPw" name="password" type="password" autocomplete="current-password" required>
      <p class="lock-err" id="lockErr" role="alert" hidden></p>
      <div class="lock-row">
        <label for="lockStay">Stay signed in for</label>
        <select id="lockStay"></select>
      </div>
      <button type="submit" class="lock-go" id="lockGo">Sign in</button>
      <p class="lock-note">Chats are saved on the server and visible to everyone with the password.</p>
    </form>
    <nav class="lock-legal" aria-label="Legal"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="credits.html">Credits</a></nav>
  </div>
</div>

<script>
  // ── Supabase (publishable key is meant to be public; Row Level Security keeps each user's data private) ──
  const SUPABASE_URL = 'https://zxvbimdxcrslvdpqqalf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_KGnwpyai1gG2rHBj6XSnmA_VlK-Yc8a';
  const API_URL = SUPABASE_URL + '/functions/v1/lennon-chat';
  const MAX_MESSAGES = 30;

  // One shared site password. It signs in to a single Supabase account; this address is never emailed.
  const SITE_EMAIL = 'kepler@example.com';
  // "Stay signed in for": the choice is remembered, the login is kept only until it runs out.
  const STAY = [
    ['visit', 'this visit only', 0],
    ['1h', '1 hour', 60],
    ['5h', '5 hours', 300],
    ['1d', '1 day', 1440],
    ['7d', '7 days', 10080],
    ['30d', '30 days', 43200],
  ];
  const UNTIL = 'kepler-until', STAY_KEY = 'kepler-stay';
  const safe = (fn, fb) => { try { return fn(); } catch { return fb; } };
  const kept = () => Number(safe(() => localStorage.getItem(UNTIL), 0)) > Date.now();
  // A saved login whose time is up is thrown away before Supabase starts, so the password screen shows.
  if (!kept()) safe(() => {
    localStorage.removeItem(UNTIL);
    for (const k of Object.keys(localStorage)) if (k.startsWith('sb-')) localStorage.removeItem(k);
    for (const k of Object.keys(sessionStorage)) if (k.startsWith('sb-')) sessionStorage.removeItem(k);
  });
  // "This visit only" keeps the login in memory: reloading or reopening the site asks again.
  const mem = new Map();
  const authStorage = {
    getItem: k => mem.has(k) ? mem.get(k) : (kept() ? safe(() => localStorage.getItem(k), null) : null),
    setItem: (k, v) => { mem.set(k, v); if (kept()) safe(() => localStorage.setItem(k, v)); },
    removeItem: k => { mem.delete(k); safe(() => localStorage.removeItem(k)); },
  };
  let stay = safe(() => localStorage.getItem(STAY_KEY), null);
  if (!STAY.some(x => x[0] === stay)) stay = '5h';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });

  const $ = id => document.getElementById(id);
  const term = $('term'), out = $('out'), form = $('form'), box = $('box'), ps1 = $('ps1');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const sleep = ms => new Promise(r => setTimeout(r, reduceMotion.matches ? 0 : ms));

  let user = null;
  let profile = { name: '', status: 'online', theme: 'light' };
  let chats = [];
  let current = null;
  let busy = false;
  let state = 'boot'; // boot | pass | chat

  // ── Output helpers ──
  const atBottom = () => term.scrollHeight - term.scrollTop - term.clientHeight < 120;
  const scroll = () => { term.scrollTop = term.scrollHeight; };
  function line(text = '', cls = '') {
    const d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    d.textContent = text;
    out.appendChild(d); scroll();
    return d;
  }
  function echo(prompt, text) {
    const d = document.createElement('div'); d.className = 'ln';
    const p = document.createElement('span'); p.className = 'ps'; p.textContent = prompt;
    d.append(p, ' ' + text);
    out.appendChild(d); scroll();
  }
  function rule(label) {
    line('── ' + label + ' ' + '─'.repeat(200), 'rule');
  }
  const BANNER = String.raw`
 _  _______ ____  _     _____ ____
| |/ / ____|  _ \| |   | ____|  _ \
| ' /|  _| | |_) | |   |  _| | |_) |
| . \| |___|  __/| |___| |___|  _ <
|_|\_\_____|_|   |_____|_____|_| \_\
`.replace(/^\n/, '');
  function banner() {
    const pre = document.createElement('pre');
    pre.className = 'banner'; pre.textContent = BANNER;
    pre.setAttribute('role', 'img'); pre.setAttribute('aria-label', 'Kepler AI');
    out.appendChild(pre);
  }
  function button(text, fn, cls = 'link-btn') {
    const b = document.createElement('button');
    b.type = 'button'; b.className = cls; b.textContent = text;
    b.onclick = e => { e.stopPropagation(); fn(b); };
    return b;
  }
  function spinner(el, label) {
    const F = ['|', '/', '-', '\\'];
    let i = 0;
    const s = document.createElement('div'); s.className = 'ln';
    s.textContent = label + ' ' + F[0];
    el.appendChild(s); scroll();
    const t = reduceMotion.matches ? 0 : setInterval(() => { s.textContent = label + ' ' + F[++i % 4]; }, 90);
    return () => { clearInterval(t); s.remove(); };
  }

  // ── Prompt and input ──
  const handle = () => {
    const n = (profile.name || '').trim() || 'user';
    return n.toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-|-$/g, '').slice(0, 16) || 'user';
  };
  const promptText = () => `${handle()}@kepler:~$`;
  function setPrompt() {
    ps1.textContent = promptText();
    box.setAttribute('aria-label', 'Message Kepler AI, or type a command');
    form.hidden = busy || state !== 'chat';
    paintStatus();
    if (!form.hidden) { scroll(); focusInput(); }
  }
  function focusInput() {
    if (form.hidden) return;
    if (matchMedia('(hover: none)').matches && document.activeElement !== box) return;
    box.focus({ preventScroll: true });
  }
  function grow() { box.style.height = 'auto'; box.style.height = box.scrollHeight + 'px'; }
  box.addEventListener('input', grow);
  function setBusy(on) { busy = on; setPrompt(); }

  // Status bar and clock
  function paintStatus() {
    const s = $('status');
    if (state === 'chat') {
      const n = chats.filter(inMode).length;
      s.textContent = `-- ${busy ? 'RUNNING' : 'INSERT'} --  model:${model}  effort:${effort}  chats:${n}`;
    } else s.textContent = state === 'boot' ? '-- BOOT --' : '-- LOCKED --';
    $('barUser').textContent = user ? handle() + '@kepler' : 'locked';
  }
  const tick = () => { $('clock').textContent = new Date().toLocaleTimeString([], { hour12: false }); };
  tick(); setInterval(tick, 1000);

  // Command history (arrow keys) and tab completion
  const hist = []; let hi = 0;
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); return; }
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !box.value.includes('\n') && hist.length) {
      e.preventDefault();
      hi = Math.max(0, Math.min(hist.length, hi + (e.key === 'ArrowUp' ? -1 : 1)));
      box.value = hist[hi] ?? ''; grow();
      box.setSelectionRange(box.value.length, box.value.length);
      return;
    }
    if (e.key === 'Tab' && state === 'chat' && /^\/\w*$/.test(box.value)) {
      e.preventDefault();
      const hits = HELP.map(h => h[0].split(' ')[0]).filter(c => c.startsWith(box.value));
      if (hits.length === 1) { box.value = hits[0] + ' '; grow(); }
      else if (hits.length) line(hits.join('   '));
    }
  });
  form.addEventListener('submit', e => { e.preventDefault(); submit(); });
  // Clicking anywhere in the terminal (without selecting text) puts the cursor back on the command line.
  term.addEventListener('click', e => {
    if (e.target.closest('button,a,input,textarea') || !getSelection().isCollapsed) return;
    focusInput();
  });

  async function submit() {
    if (busy || state !== 'chat') return;
    const raw = box.value, v = raw.trim();
    box.value = ''; grow();
    echo(promptText(), raw);
    if (v) { if (hist[hist.length - 1] !== raw) hist.push(raw); hi = hist.length; }
    return v.startsWith('/') ? command(v) : (v && send(v));
  }

  // ── Boot and login ──
  async function bootSeq() {
    banner();
    for (const t of ['mounting /dev/kepler', 'loading language models', 'opening secure channel', 'starting shell']) {
      await sleep(110); line(t, 'ok');
    }
    await sleep(120);
  }
  const booted = bootSeq();

  // ── Password screen ──
  const lockEl = $('lock'), lockPw = $('lockPw'), lockErr = $('lockErr'), lockGo = $('lockGo'), lockStay = $('lockStay');
  lockStay.innerHTML = STAY.map(([k, label]) => `<option value="${k}">${label}</option>`).join('');
  lockStay.value = stay;
  lockStay.onchange = () => { stay = lockStay.value; safe(() => localStorage.setItem(STAY_KEY, stay)); };
  function showLock() {
    state = 'pass';
    document.body.classList.remove('in');
    setPrompt();
    lockErr.hidden = true; lockPw.value = '';
    lockEl.hidden = false;
    $('side').inert = true; document.querySelector('.app').inert = true;
    lockPw.focus();
  }
  function hideLock() {
    lockEl.hidden = true;
    document.querySelector('.app').inert = false; closeSide();
  }

    busy = true; lockGo.disabled = true; lockGo.textContent = 'Signing in…'; lockErr.hidden = true;

  // Replies: plain text, code blocks, and pictures.
  function parseBlocks(text) {
    const res = [], re = /```[ \t]*([\w#+.-]*)[^\n]*\n([\s\S]*?)(```|$)/g;
    let last = 0, m;
    while ((m = re.exec(text))) {

      res.push({ type: 'code', lang: m[1].toLowerCase(), code: m[2].replace(/\n$/, '') });

  }
  // The AI is asked for [[image: description]], but it sometimes writes an <img> tag, a markdown image
  // or a bare Pollinations link instead: all of these become a picture, never raw text.
  const POLL = /^https:\/\/image\.pollinations\.ai\/prompt\/[^\s"'<>]+$/i;
  const PIC_RE = /\[\[image:\s*([^\]]+?)\s*\]\]|<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["'][^>]*>|!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)|(https:\/\/image\.pollinations\.ai\/prompt\/[^\s"'<>)\]]+)/gi;
  const picPrompt = url => { try { return decodeURIComponent(new URL(url).pathname.replace(/^\/prompt\//, '')).replace(/\+/g, ' '); } catch { return 'generated picture'; } };
  function picParts(text) {
    const res = []; let last = 0, m;

    while ((m = PIC_RE.exec(text))) {
      let pic = null;
      if (m[1]) pic = { prompt: m[1] };
      else {
        const url = (m[2] || m[4] || m[5] || '').replace(/&amp;/g, '&');
        const alt = m[2] ? ((m[0].match(/\balt\s*=\s*["']([^"']*)["']/i) || [])[1] || '') : (m[3] || '');
        if (POLL.test(url)) pic = { url, prompt: (alt || picPrompt(url)).replace(/&amp;/g, '&').replace(/&quot;/g, '"') };
      }
      if (!pic) continue;
      if (m.index > last) res.push(text.slice(last, m.index));
      res.push(pic); last = PIC_RE.lastIndex;

    if (last < text.length) res.push(text.slice(last));

  }
  const onlyPics = code => { const ps = picParts(code); return ps.some(x => typeof x === 'object') && ps.every(x => typeof x === 'object' || !x.replace(/<\/?(p|div|figure|figcaption|br)[^>]*>/gi, '').trim()); };
  // Structure in replies: list markers, "Label:" starts, `code`, **bold** and links. Built from text nodes only.
  const INLINE_RE = /`([^`\n]+)`|\*\*([^*\n]+)\*\*|(https?:\/\/[^\s<>"')\]]+[^\s<>"')\].,;:!?])/g;
  function inline(parent, text) {
    let last = 0, m; INLINE_RE.lastIndex = 0;
    while ((m = INLINE_RE.exec(text))) {

  function styleText(node, text) {

        node.appendChild(document.createTextNode(mk[1]));

  function genImage(prompt, given) {
    let seed = 0; for (const ch of prompt) seed = (seed * 31 + ch.charCodeAt(0)) % 1000000;
    const url = given || `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt.slice(0, 600))}?width=1024&height=1024&nologo=true&seed=${seed}`;
    const fig = document.createElement('figure'); fig.className = 'fig';
    const img = document.createElement('img'); img.alt = prompt; img.loading = 'lazy'; img.decoding = 'async'; img.referrerPolicy = 'no-referrer'; img.src = url;
    const cap = document.createElement('figcaption'), d = document.createElement('span'), a = document.createElement('a');

  // Types the reply out a few characters at a time, with a block cursor (long replies finish within ~15 s).
  function typeOut(el) {
    if (reduceMotion.matches) return Promise.resolve();
    const units = [];

        let off = 0, at = null;
        for (const u of units) {

          else { if (u.node.nodeValue.length !== want) u.node.nodeValue = u.full.slice(0, want); at = u.node; }
          off += u.len;
        }
        if (at && at.parentNode) at.parentNode.insertBefore(cur, at.nextSibling);
        if (near) scroll();
        if (target >= total || !el.isConnected) {
          for (const u of units) { if (u.fig) u.fig.hidden = false; else u.node.nodeValue = u.full; }
          cur.remove(); resolve();
        } else requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  // ── Reply actions: [copy] [retry] [speak] ──
  function copyRaw(text) {
    if (navigator.clipboard) return navigator.clipboard.writeText(text);

    try { document.execCommand('copy'); } finally { t.remove(); }

  function flash(b, text) { const old = b.textContent; b.textContent = text; setTimeout(() => { if (b.isConnected) b.textContent = old; }, 1400); }

  async function retry(chat) {

  // ── Models: Titan (best), Pan (middle), Janus (fastest), versions 2 to 5.5 ──
  const FAMILIES = { titan: 'smartest', pan: 'balanced', janus: 'fastest' };
  const VERSIONS = ['2', '2.5', '3', '3.5', '4', '4.5', '5', '5.5'];
  const EFFORTS = { low: 'quick answers, less thinking', medium: 'a balance of speed and thinking', high: 'thinks longest for hard questions' };
  const validModel = m => !!m && m.split('-')[0] in FAMILIES && VERSIONS.includes(m.split('-')[1]);
  let model = safe(() => localStorage.getItem('kepler-model'), null);
  if (!validModel(model)) model = 'titan-5.5';
  let effort = safe(() => localStorage.getItem('kepler-effort'), null);
  if (!EFFORTS[effort]) effort = 'medium';

  // ── Commands ──
  const HELP = [
    ['/help', 'show this list'],
    ['/new', 'start a new chat'],
    ['/ls', 'list saved chats'],
    ['/open N', 'open chat number N'],
    ['/mv N TITLE', 'rename chat N'],
    ['/rm N', 'delete chat N'],
    ['/find TEXT', 'search your chats'],
    ['/model [NAME]', 'show or set the model'],
    ['/effort [LEVEL]', 'low, medium or high'],
    ['/attach', 'add a text file to your next message'],
    ['/copy', 'copy the last reply'],
    ['/retry', 'ask for the last reply again'],
    ['/clear', 'clear the screen'],
    ['/name NAME', 'set your display name'],
    ['/whoami', 'show your account'],
    ['/about', 'about Kepler AI'],
    ['/wipe', 'delete all chats'],
    ['/lock', 'lock the site (asks for the password again)'],

  function table(rows) {
    for (const [k, d] of rows) {
      const r = document.createElement('div'); r.className = 'ln help-row';
      const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
      const b = document.createElement('span'); b.textContent = d;
      r.append(a, b); out.appendChild(r);
    }
    scroll();
  }
  const chatAt = n => { const c = visible()[Number(n) - 1]; if (!c) line(`no chat number ${n || '?'}. use /ls to see the list.`, 'err'); return c; };
  async function command(input) {
    const [cmd, ...rest] = input.split(/\s+/);
    const arg = rest.join(' ').trim();
    switch (cmd.toLowerCase()) {
      case '/help': case '/?': table(HELP); line('tab completes commands. arrow up and down recall earlier input.'); break;
      case '/new': newChat(); break;
      case '/ls': {
        const all = visible();
        if (!all.length) { line('no saved chats.'); break; }
        all.forEach((c, i) => line(`${String(i + 1).padStart(2, '0')}  ${(c.updated_at || '').slice(0, 10) || '----------'}  ${c.title || 'untitled'}${c === current ? '  *' : ''}`));
        break;
      }
      case '/open': case '/cd': { const c = chatAt(arg); if (c) openChat(c); break; }
      case '/rm': { const c = chatAt(arg); if (c) await deleteChat(c); break; }

      }

        if (!arg) { line('search cleared.'); break; }

      case '/model': {

        const m = arg.toLowerCase().replace(/\s+/, '-');
        if (!validModel(m)) { line('unknown model: ' + arg + '. type /model to see the list.', 'err'); break; }
        model = m; safe(() => localStorage.setItem('kepler-model', model)); paintStatus(); line('model set to ' + model + '.', 'ok');
        break;
      }
      case '/effort': {
        const e = arg.toLowerCase();
        if (!e) { table(Object.entries(EFFORTS).map(([k, d]) => [(k === effort ? '* ' : '  ') + k, d])); break; }
        if (!EFFORTS[e]) { line('effort must be low, medium or high.', 'err'); break; }
        effort = e; safe(() => localStorage.setItem('kepler-effort', effort)); paintStatus(); line('effort set to ' + effort + '.', 'ok');
        break;
      }
      case '/attach': $('file').click(); break;
      case '/copy': {
        const m = current && [...current.messages].reverse().find(x => x.role === 'assistant');
        if (!m) { line('no reply to copy.', 'err'); break; }
        copyRaw(m.content).then(() => line('copied to clipboard.', 'ok'), () => line('could not copy.', 'err'));
        break;
      }
      case '/retry': if (current) await retry(current); else line('nothing to retry.', 'err'); break;
      case '/clear': case '/cls': out.innerHTML = ''; break;
      case '/name': {
        if (!arg) { line('usage: /name YOUR NAME', 'err'); break; }
        profile.name = arg.slice(0, 40); saveProfile(); setPrompt(); line('hello, ' + profile.name + '.', 'ok');
        break;
      }
      case '/whoami': {
        const until = Number(safe(() => localStorage.getItem(UNTIL), 0));
        line(`${handle()}  ::  signed in ${until > Date.now() ? 'until ' + new Date(until).toLocaleString() : 'for this visit only'}`);
        break;
      }
      case '/about':
        line("Kepler AI is a friendly assistant. Ask questions, get help with writing or homework, or just chat. It can make mistakes, so check important answers.");
        line('Chats are saved to the site account in Supabase.');
        line('Powered by Groq. Built by Lennon, Kepler Designs.');
        break;
      case '/wipe': {
        if (arg !== 'confirm') { line(`this deletes all your chats. type "/wipe confirm" to proceed.`); break; }
        const { error } = await sb.from('chats').delete().eq('user_id', user.id);
        if (error) { line('could not delete your chats. try again.', 'err'); break; }
        chats = []; current = null; render(); line('all chats deleted.', 'ok');
        break;
      }
      case '/logout': case '/lock': case '/exit': case '/quit': lock(); break;
      default: line(`${cmd}: command not found. type /help for the list.`, 'err');
    }
  }

  // Attach a text file: it's added to the command line so you can say something about it.
  $('file').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const text = f.size > 12000 ? null : await f.text();
    if (text === null || box.value.length + text.length + f.name.length + 12 > 4000) { line('that file is too long. messages can be up to 4,000 characters, including files.', 'err'); return; }
    box.value = (box.value ? box.value + '\n\n' : '') + `Here is ${f.name}:\n${text}`;
    grow(); line(`attached ${f.name} (${text.length} chars). add a message and press enter.`, 'ok'); focusInput();
  };

  // ── Chat ──
  async function send(text) {
    if (!user) return;
    if (text.length > 4000) { line('that message is too long. keep it under 4,000 characters.', 'err'); return; }
    if (!current) {
      current = { id: null, title: text.slice(0, 40), messages: [], mode: 'chat' };
      chats.unshift(current);
    }
    current.messages.push({ role: 'user', content: text });
    renderSide();
    await ask(current);
  }
  async function ask(chat) {
    setBusy(true);
    const el = aiMsg();
    const stop = spinner(el.body, 'processing');
    let saved = false;
    try {
      const { data: s } = await sb.auth.getSession();
      if (!s.session) { stop(); el.remove(); line('you were signed out. log in again to keep chatting.', 'err'); return; }
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.session.access_token },
        body: JSON.stringify({ model, effort, mode: 'chat', messages: chat.messages.slice(-MAX_MESSAGES).map(m => ({ role: m.role, content: m.content })) }),
      });
      const data = await res.json().catch(() => ({}));
      stop();
      if (!res.ok) { el.remove(); line(data.error || 'something went wrong. try again.', 'err'); return; }
      const msg = { role: 'assistant', content: String(data.reply || '') };
      chat.messages.push(msg);
      saveChat(chat).then(renderSide).catch(() => {}); saved = true;
      fillAi(el.body, msg.content);
      await typeOut(el.body);
      if (el.isConnected) addActions(el, chat, msg);
    } catch {
      stop(); el.remove();
      line('could not reach Kepler AI. check your connection and try again.', 'err');
    } finally {
      if (!saved && chat.messages.length) saveChat(chat).catch(() => {});
      setBusy(false);
      if (atBottom()) scroll();
    }
  }

  // ── Session ──
  let lastUserId = null;
  sb.auth.onAuthStateChange((event, session) => {
    user = session?.user || null;
    if (!user) {
      const was = lastUserId;
      lastUserId = null; chats = []; current = null; renderSide();
      clearTimeout(lockT);
      if (was) { out.innerHTML = ''; banner(); line('locked.', 'ok'); }
      showLock();
      return;
    }
    if (user.id !== lastUserId) {
      lastUserId = user.id;
      lockTimer();
      booted.then(() => setTimeout(() => enter().catch(() => {}), 0));
    }
  });
</script>
</body>
</html>
